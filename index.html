<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Học HTML cơ bản – Tin học THPT</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="preconnect" href="https://www.gstatic.com" crossorigin>
  <link rel="preconnect" href="https://firestore.googleapis.com" crossorigin>
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <div class="brand">
        <span class="brand-logo">&lt;/&gt;</span>
        <div><strong>Học HTML cơ bản</strong><span class="brand-sub" id="brand-sub"></span></div>
      </div>
      <div class="who-box">
        <span id="who"></span>
        <button type="button" id="btn-reset-student" class="link-btn" hidden>Đổi người làm bài</button>
      </div>
    </div>
    <nav id="stepper" class="stepper" aria-label="Các giai đoạn bài học"></nav>
    <div class="progress-row">
      <span id="progress-text">Tiến độ bài học: 0%</span>
      <div id="progress-bar" class="progress" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
        <div id="progress-fill" class="progress-fill"></div>
      </div>
    </div>
  </header>

  <main id="main" class="container"></main>

  <noscript><p class="container">Trang web cần bật JavaScript để hoạt động.</p></noscript>

  <!-- Thứ tự nạp quan trọng: các module dùng chung nạp trước, app.js nạp cuối -->
  <script src="js/lesson-config.js"></script>
  <script src="js/firebase-config.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/validators.js"></script>
  <script src="js/editor.js"></script>
  <script src="js/api.js"></script>
  <script src="js/activity.js"></script>
  <script src="js/learning.js"></script>
  <script src="js/practice.js"></script>
  <script src="js/final.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
